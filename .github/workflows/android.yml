name: Build VidGame Android app
on:
  push:
    branches: [vidgame-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk VidGame.apk
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vidgame-app -y --cleanup-tag || true
          gh release create vidgame-app VidGame.apk --target "${{ github.sha }}" --title "VidGame Android app" \
            --notes "Download VidGame.apk on your Android phone and open it to install. Your face shows in a small window with the back camera behind it."
