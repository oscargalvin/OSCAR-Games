<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f12">
  <title>VidGame</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 44'%3E %3Cpath d='M16 5h32c8 0 12.5 5.5 13.8 13.5l1.6 11c.9 6.3-4.2 10.4-9.3 7.6-2.8-1.6-5.4-4.7-7.6-7.6H17.5c-2.2 2.9-4.8 6-7.6 7.6C4.8 40.9-.3 36.8.6 30.5l1.6-11C3.5 10.5 8 5 16 5z' fill='%23000' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E %3Cpath d='M12.5 13.5h4v4h4v4h-4v4h-4v-4h-4v-4h4z' fill='%23fff'/%3E %3Ccircle cx='50' cy='14.5' r='2.6' fill='%23fff'/%3E %3Ccircle cx='55' cy='19.5' r='2.6' fill='%23fff'/%3E %3Ccircle cx='45' cy='19.5' r='2.6' fill='%23fff'/%3E %3Ccircle cx='50' cy='24.5' r='2.6' fill='%23fff'/%3E %3Crect x='24.5' y='13' width='15' height='11.5' rx='2.4' fill='%23fff'/%3E %3Crect x='28' y='10.6' width='5.5' height='3.2' rx='1' fill='%23fff'/%3E %3Ccircle cx='32' cy='18.75' r='4' fill='%23000'/%3E %3Ccircle cx='32' cy='18.75' r='2.1' fill='%23e11d48'/%3E %3Ccircle cx='37.2' cy='15.4' r='0.9' fill='%23e11d48'/%3E %3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=1794152391">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/"><span class="logo-mark" aria-hidden="true"></span> VidGame</a>
    <form id="search-form" class="search-form" role="search">
      <input id="search" class="search" type="search" placeholder="Search videos and channels" aria-label="Search videos and channels" enterkeyhint="search">
      <button class="search-btn" aria-label="Search">🔍</button>
    </form>
    <button id="help-btn" class="icon-btn" title="Watch the tutorial" aria-label="Watch the tutorial">?</button>
  </header>

  <main id="app"></main>

  <!-- Bottom bar -->
  <nav class="bottom-bar" aria-label="Main">
    <a class="tab" data-tab="home" href="#/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a class="tab" data-tab="vidgames" href="#/vidgames">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10a5 5 0 0 1 4.9 6l-.8 4a2.6 2.6 0 0 1-4.5 1.2L14.5 16h-5l-2.1 2.2A2.6 2.6 0 0 1 2.9 17l-.8-4A5 5 0 0 1 7 7zm0 3v1.5H5.5v1.5H7v1.5h1.5V13H10v-1.5H8.5V10zm9.3.2a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>
      <span>VidGames</span>
    </a>
    <button id="post-btn" class="tab tab-post" data-tab="post" aria-label="Post a video">
      <span class="post-circle">＋</span>
      <span>Post</span>
    </button>
    <a class="tab" data-tab="stars" href="#/stars">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
      <span>Stars</span>
    </a>
    <a class="tab" data-tab="channel" href="#/channel">
      <span id="tab-avatar" class="avatar avatar-sm">V</span>
      <span>Your channel</span>
    </a>
  </nav>

  <!-- Post sheet -->
  <div id="post-sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title">Post a video</h2>
      <a class="sheet-option" href="#/record" id="opt-record">
        <span class="sheet-icon rec">●</span>
        <span><strong>Record a video</strong><small>Use your camera and microphone</small></span>
      </a>
      <label class="sheet-option">
        <span class="sheet-icon">⬆</span>
        <span><strong>Upload a video</strong><small>Pick a video file from this device</small></span>
        <input id="upload-input" type="file" accept="video/*" hidden>
      </label>
      <button id="sheet-cancel" class="btn sheet-cancel">Cancel</button>
    </div>
  </div>

  <!-- Tutorial (first open, and the ? button) -->
  <div id="tutorial" class="tutorial" hidden role="dialog" aria-modal="true" aria-labelledby="tut-title">
    <div class="tut-box">
      <div class="tut-head">
        <h2 id="tut-title">How to record on VidGame</h2>
        <button id="tut-skip" class="tut-skip">Skip</button>
      </div>
      <video id="tut-video" class="tut-video" playsinline controls muted loop></video>
      <p class="tut-hint">Watch how to record and post a video, then name your channel.</p>
      <div class="tut-name-row">
        <input id="tut-name-input" class="tut-name" maxlength="40" placeholder="Your channel name" aria-label="Your channel name">
        <button id="tut-done" class="btn btn-primary">Start using VidGame</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <template id="tpl-home">
    <section>
      <h1 class="page-title">Home</h1>
      <div id="featured" class="featured">
        <video id="home-tut-video" class="player" playsinline controls muted></video>
        <div class="featured-info">
          <span class="badge">Tutorial</span>
          <h2>How to record a video on VidGame</h2>
          <p class="muted">Tap ＋ Post, choose Record, press the red button, then post it to your channel.</p>
          <a class="by" href="#/"><span class="logo-mark sm" aria-hidden="true"></span> VidGame</a>
        </div>
      </div>
      <div id="sections" class="sections"></div>
      <div id="empty" class="empty" hidden>
        <p>No videos yet.</p>
        <button class="btn btn-primary open-post">＋ Post your first video</button>
      </div>
    </section>
  </template>

  <template id="tpl-channel">
    <section class="channel">
      <div class="channel-head">
        <button id="ch-avatar-btn" class="avatar-btn" aria-label="Change your badge" title="Change your badge">
          <span id="ch-avatar" class="avatar avatar-lg">V</span>
          <span class="avatar-edit" aria-hidden="true">✎</span>
        </button>
        <div class="channel-info">
          <h1 id="ch-name"></h1>
          <form id="ch-form" class="ch-form" hidden>
            <input id="ch-input" maxlength="40" aria-label="Channel name">
            <button class="btn btn-primary">Save</button>
          </form>
          <p id="ch-stats" class="muted"></p>
          <div class="channel-actions">
            <button id="ch-edit" class="btn">Edit name</button>
            <button id="ch-badge" class="btn">Change badge</button>
            <button id="ch-tutorial" class="btn">Watch tutorial</button>
          </div>
        </div>
      </div>
      <div id="badge-editor" class="badge-editor" hidden>
        <div class="be-preview">
          <span id="be-avatar" class="avatar avatar-xl">V</span>
          <small class="muted">Preview</small>
        </div>
        <div class="be-options">
          <div class="be-group">
            <h3>Badge style</h3>
            <div class="be-tabs" role="group" aria-label="Badge style">
              <button class="be-tab" data-type="letter">Letter</button>
              <button class="be-tab" data-type="emoji">Emoji</button>
              <button class="be-tab" data-type="drawing">✏️ Draw your badge</button>
              <button class="be-tab" data-type="photo">Photo</button>
            </div>
          </div>
          <div class="be-group" id="be-letter-group">
            <h3>Your letters</h3>
            <input id="be-letters" class="be-input" maxlength="2" placeholder="Up to 2 letters" aria-label="Badge letters">
          </div>
          <div class="be-group" id="be-emoji-group" hidden>
            <h3>Pick an emoji</h3>
            <div id="be-emojis" class="be-emojis"></div>
          </div>
          <div class="be-group" id="be-photo-group" hidden>
            <h3>Your photo</h3>
            <div id="crop-area" class="crop-area" hidden>
              <canvas id="crop-canvas" class="draw-canvas crop-canvas" width="384" height="384" aria-label="Your photo. Drag to move it."></canvas>
              <div class="crop-zoom">
                <span aria-hidden="true">➖</span>
                <input id="crop-zoom" type="range" min="1" max="5" step="0.01" value="1" aria-label="Zoom">
                <span aria-hidden="true">➕</span>
              </div>
              <small class="muted">Slide to zoom in on your face, then drag the photo to move it. You can also pinch or scroll.</small>
            </div>
            <label class="btn">
              🖼 Choose a photo
              <input id="be-photo" type="file" accept="image/*" hidden>
            </label>
            <small class="muted">On a phone you can take a new photo too.</small>
          </div>
          <div class="be-group" id="be-drawing-group" hidden>
            <h3>Draw your badge</h3>
            <div class="draw-wrap">
              <canvas id="draw-canvas" class="draw-canvas" width="384" height="384" aria-label="Drawing area for your badge"></canvas>
              <div class="draw-tools">
                <div id="draw-colors" class="draw-colors" role="group" aria-label="Pen colour"></div>
                <div id="draw-picker" class="cp-holder" hidden></div>
                <div class="draw-row" role="group" aria-label="Pen size">
                  <button class="draw-size" data-size="6" aria-label="Thin pen"><i style="width:6px;height:6px"></i></button>
                  <button class="draw-size sel" data-size="14" aria-label="Medium pen"><i style="width:12px;height:12px"></i></button>
                  <button class="draw-size" data-size="30" aria-label="Thick pen"><i style="width:20px;height:20px"></i></button>
                  <button id="draw-eraser" class="draw-tool" aria-pressed="false" title="Eraser">🧽 Eraser</button>
                </div>
                <div class="draw-row">
                  <button id="draw-fill" class="draw-tool" aria-pressed="false" title="Tap an area to colour it in">🪣 Fill</button>
                  <button id="draw-undo" class="draw-tool">↶ Undo</button>
                  <button id="draw-clear" class="draw-tool">🗑 Clear</button>
                </div>
              </div>
            </div>
            <small class="muted">The circle shows what will be on your badge.</small>
          </div>
          <div class="be-group" id="be-color-group">
            <h3>Background colour</h3>
            <div id="be-colors" class="be-colors"></div>
            <div id="be-picker" class="cp-holder" hidden></div>
          </div>
          <div class="be-actions">
            <button id="be-save" class="btn btn-primary">Save badge</button>
            <button id="be-cancel" class="btn">Cancel</button>
          </div>
        </div>
      </div>
      <h2 class="section-title">Your videos</h2>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>
        <p>Your channel has no videos yet.</p>
        <button class="btn btn-primary open-post">＋ Post a video</button>
      </div>
    </section>
  </template>

  <template id="tpl-list">
    <section class="list-page">
      <h1 id="list-title" class="page-title"></h1>
      <p id="list-sub" class="muted"></p>
      <div id="list-chips" class="chips"></div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>
        <p id="empty-text"></p>
        <a class="btn btn-primary" href="#/">Find videos on Home</a>
      </div>
    </section>
  </template>

  <template id="tpl-watch">
    <section class="watch">
      <div class="player-wrap">
        <video id="player" class="player" controls autoplay playsinline></video>
        <div class="side-rail">
          <button id="star-btn" class="rail-btn" aria-pressed="false" title="Star this video">
            <span class="rail-icon">☆</span>
            <span id="star-count" class="rail-count">0</span>
          </button>
        </div>
      </div>
      <h1 id="watch-title" class="watch-title"></h1>
      <div class="watch-owner">
        <a class="watch-channel" href="#/channel"><span id="watch-avatar" class="avatar avatar-sm">V</span>
          <span class="owner-text"><span id="watch-channel"></span><small id="watch-vidgamers" class="muted"></small></span></a>
        <button id="vidgame-btn" class="btn vidgame-btn" hidden>🎮 VidGame</button>
      </div>
      <div class="watch-meta">
        <span id="watch-info"></span>
        <span class="spacer"></span>
        <a id="download" class="btn" download>⬇ Download</a>
        <button id="delete" class="btn btn-danger">Delete</button>
      </div>
      <div id="confirm-delete" class="confirm" hidden>
        <span>Delete this video? This can't be undone.</span>
        <button id="confirm-yes" class="btn btn-danger">Yes, delete</button>
        <button id="confirm-no" class="btn">Keep it</button>
      </div>
    </section>
  </template>

  <template id="tpl-record">
    <section class="record">
      <h1 class="page-title">Record a video</h1>
      <div class="source-toggle" role="group" aria-label="What to record">
        <button id="src-camera" class="src-btn active" aria-pressed="true">📷 Camera</button>
        <button id="dual-cam" class="src-btn" aria-pressed="false">😀 Face + background</button>
        <button id="src-screen" class="src-btn" aria-pressed="false">🖥 Screen</button>
        <button id="src-both" class="src-btn" aria-pressed="false">🖥 Screen + 😀 face</button>
      </div>
      <div class="stage">
        <video id="preview" class="player" autoplay muted playsinline></video>
        <div id="rec-badge" class="rec-badge" hidden><span class="dot"></span> <span id="timer">0:00</span></div>
        <div id="paused-cover" class="paused-cover" hidden>
          <strong>❚❚ Paused</strong>
          <span>Take a break. This part won't be in your video.</span>
        </div>
        <div id="cam-msg" class="cam-msg">
          <p id="cam-msg-text">Starting camera…</p>
          <button id="cam-retry" class="btn" hidden>Try again</button>
        </div>
      </div>

      <div class="controls">
        <select id="camera-select" title="Camera" aria-label="Camera" hidden></select>
        <select id="mic-select" title="Microphone" aria-label="Microphone" hidden></select>
        <button id="flip-cam" class="btn" title="Switch between your front and back camera">🔄 Flip camera</button>
        <label class="check" id="mirror-wrap"><input id="mirror" type="checkbox" checked> Mirror</label>
        <button id="bubble-toggle" class="btn" hidden>🙈 Hide face bubble</button>
        <label class="check" id="bubble-wrap" hidden>Face size <input id="bubble-size" type="range" min="0.15" max="0.45" step="0.01" value="0.26"></label>
      </div>

      <div class="rec-controls">
        <button id="btn-pause" class="btn btn-big" hidden>❚❚ Pause</button>
        <button id="btn-start" class="rec-btn" aria-label="Start recording"><span></span></button>
        <button id="btn-stop" class="btn btn-danger btn-big" hidden>■ Stop</button>
      </div>
      <p id="rec-label" class="rec-label">Press the red button to start recording</p>
      <p id="bubble-hint" class="rec-limit muted" hidden>Drag your face bubble to move it anywhere. You can move it, resize it, hide it or swap it any time, even in the middle of a video.</p>
      <p class="rec-limit muted">Videos can be as short as you like, up to 48 hours long.</p>

      <div id="review" class="review" hidden>
        <h2>Your recording</h2>
        <video id="review-player" class="player" controls playsinline></video>
        <input id="title" class="title-input" type="text" maxlength="120" placeholder="Give your video a title">
        <div class="controls">
          <button id="btn-save" class="btn btn-primary btn-big">Post video</button>
          <a id="btn-download-rec" class="btn btn-big" download="recording.webm">⬇ Download</a>
          <button id="btn-retake" class="btn btn-big">↺ Record again</button>
        </div>
      </div>
    </section>
  </template>

  <script src="app.js?v=1794152391"></script>
</body>
</html>
