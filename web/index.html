<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Oscar Galvin's Game Center: quick games to play on your phone.">
  <meta name="theme-color" content="#2A3FD4">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OSCAR Games">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OSCAR Games</title>
  <style>
    /* Match the app colour while it loads, and stop the browser from
       bouncing, pull-to-refresh or double-tap zooming during games. */
    html, body {
      margin: 0;
      height: 100%;
      background: #15172A;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Online play in Outplay. -->
  <script src="peerjs/peerjs.min.js" defer></script>
  <script src="outplay_net.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
